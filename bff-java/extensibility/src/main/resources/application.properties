# Standalone config for the `extensibility` module.
spring.application.name=extensibility
server.port=8088

# commercetools credentials, read from the gitignored .env by spring-dotenv.
ctp.project-key=${CTP_PROJECT_KEY}
ctp.client-id=${CTP_CLIENT_ID}
ctp.client-secret=${CTP_CLIENT_SECRET}
ctp.auth-url=${CTP_AUTH_URL}
ctp.api-url=${CTP_API_URL}
ctp.store-key=${CTP_STORE_KEY:}
ctp.checkout.application-key=${CTP_CHECKOUT_APPLICATION_KEY:demo-commercetools-checkout-taxes}
ctp.import.api-url=${CTP_IMPORT_API_URL:}

# Session 7 — see .env.example for what each of these is.
lhc.extensibility.public-url=${EXTENSION_PUBLIC_URL:}
lhc.extensibility.secret=${EXTENSION_SECRET:}
lhc.extensibility.timeout-ms=${EXTENSION_TIMEOUT_MS:2000}
# Standalone, the order module is not on this port — the consumer's transition calls will 404 unless the
# full BFF (:8081) is running too. Point it there.
lhc.extensibility.bff-base-url=${BFF_BASE_URL:http://localhost:8081}
