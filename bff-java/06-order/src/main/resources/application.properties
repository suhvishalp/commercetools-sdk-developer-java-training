# Standalone config for the `order` module.
spring.application.name=order
server.port=8087

# commercetools credentials, read from the gitignored .env by spring-dotenv.
ctp.project-key=${CTP_PROJECT_KEY}
ctp.client-id=${CTP_CLIENT_ID}
ctp.client-secret=${CTP_CLIENT_SECRET}
ctp.auth-url=${CTP_AUTH_URL}
ctp.api-url=${CTP_API_URL}
ctp.store-key=${CTP_STORE_KEY:}
# commercetools Checkout (Payment Only) — the Application key; hosts derive from the API URL's region.
ctp.checkout.application-key=${CTP_CHECKOUT_APPLICATION_KEY:demo-commercetools-checkout-taxes}
