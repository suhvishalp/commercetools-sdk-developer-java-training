# Full BFF (aggregator) — the contract the training companion talks to.
spring.application.name=training-bff
server.port=8081

# commercetools credentials, read from the gitignored .env by spring-dotenv.
ctp.project-key=${CTP_PROJECT_KEY}
ctp.client-id=${CTP_CLIENT_ID}
ctp.client-secret=${CTP_CLIENT_SECRET}
ctp.auth-url=${CTP_AUTH_URL}
ctp.api-url=${CTP_API_URL}
ctp.store-key=${CTP_STORE_KEY:}

# One shopper session per browser: the lhc_session cookie (HttpOnly, SameSite=Lax, 3 h idle) is configured
# in platform (session/SessionCookieConfig) so every module behaves the same. SESSION_COOKIE_SECURE=true in
# production (HTTPS).

# Swagger UI at http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Training progress tracking. Participant identity from .env; progress persisted to a
# commercetools Custom Object (container "training-progress"). Use "memory" for a local store.
training.participant-id=${PARTICIPANT_ID:local}
training.participant-name=${PARTICIPANT_NAME:Local Participant}
training.progress-store=${TRAINING_PROGRESS_STORE:ct}
# commercetools Checkout (Payment Only) — Session 6; hosts derive from the API URL's region.
ctp.checkout.application-key=${CTP_CHECKOUT_APPLICATION_KEY:demo-commercetools-checkout-taxes}

# Session 7 — extensibility. The Import API host derives from the API URL's region unless set.
ctp.import.api-url=${CTP_IMPORT_API_URL:}
# The public URL the platform can reach this BFF on (a cloudflared quick tunnel) — API Extensions (7.6/7.7).
lhc.extensibility.public-url=${EXTENSION_PUBLIC_URL:}
# Shared secret the platform sends back in the Authorization header of every Extension call.
lhc.extensibility.secret=${EXTENSION_SECRET:}
# Extension time budget (ms) — default 2000, platform maximum 10000; aim to answer in ~50 ms.
lhc.extensibility.timeout-ms=${EXTENSION_TIMEOUT_MS:2000}
# Where the idempotent consumer (7.4) calls the BFF's own order-state endpoint (module independence).
lhc.extensibility.bff-base-url=${BFF_BASE_URL:http://localhost:8081}
